<!DOCTYPE html>
<html lang="en" data-baseurl="{{ site.baseurl }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ page.title }} | {{ site.title }}</title>

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
  <style>body{background:#00AEEF!important}</style>
</head>
<body>
  {% include header.html %}

  {%- assign use_full_bleed = page.full_bleed | default: false -%}
  <main id="main-content" tabindex="-1" class="{% if use_full_bleed %}main--bleed{% endif %}">
    <div class="{% if use_full_bleed %}container-bleed{% else %}container{% endif %}">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <script src="{{ site.baseurl }}/assets/js/main.js" defer></script>
</body>
</html>
