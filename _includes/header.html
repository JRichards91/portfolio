<header class="site-header">
  <div class="nav-bar container">
    <!-- Left: current page title (non-clickable, matches section heading weight) -->
    <div class="site-current" role="heading" aria-level="1">
      <span class="site-current-text">
        {{ page.title | default: site.title }}
      </span>
    </div>

    <!-- Right: burger / X toggle -->
    <button
      class="burger"
      aria-label="Toggle menu"
      aria-controls="mobile-drawer"
      aria-expanded="false"
    >
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>

  <!-- Drawer (the CSS chooses the animation/placement by mode) -->
  <nav id="mobile-drawer" class="mobile-drawer" aria-hidden="true">
    <ul class="menu-list">
      <li><a href="{{ '/'            | relative_url }}">Home</a></li>
      <li><a href="{{ '/about/'      | relative_url }}">About</a></li>
      <li><a href="{{ '/projects/'   | relative_url }}">Projects</a></li>
      <li><a href="{{ '/resume/'     | relative_url }}">Resume</a></li>
      <li><a href="{{ '/contact/'    | relative_url }}">Contact</a></li>
    </ul>
  </nav>

  <!-- Backdrop (blur; CSS varies by mode) -->
  <div class="drawer-backdrop" hidden></div>
</header>
