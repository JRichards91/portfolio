<header class="site-header">
  <div class="nav-bar container">
    <!-- Left: current page title (non-clickable) -->
    <div class="site-current" role="heading" aria-level="1">
      <span class="site-current-text">
        {{ page.title | default: site.title }}
      </span>
    </div>

    <!-- Right: burger / X toggle -->
    <button
      class="burger"
      aria-label="Toggle menu"
      aria-controls="mobile-drawer"
      aria-expanded="false"
    >
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>

  <!-- Compact popover menu (auto-sizes to links) -->
  <nav
    id="mobile-drawer"
    class="mobile-drawer"
    aria-hidden="true"
    role="menu"
  >
    <ul class="menu-list">
      <li role="none"><a role="menuitem" href="{{ '/'            | relative_url }}">Home</a></li>
      <li role="none"><a role="menuitem" href="{{ '/about/'      | relative_url }}">About</a></li>
      <li role="none"><a role="menuitem" href="{{ '/projects/'   | relative_url }}">Projects</a></li>
      <li role="none"><a role="menuitem" href="{{ '/resume/'     | relative_url }}">Resume</a></li>
      <li role="none"><a role="menuitem" href="{{ '/contact/'    | relative_url }}">Contact</a></li>
    </ul>
  </nav>

  <!-- Backdrop for outside-click close -->
  <div class="drawer-backdrop" hidden></div>
</header>
