<header class="site-header" role="banner">
  <div class="container nav-container">
    <a class="site-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <!-- Desktop nav (kept exactly like before) -->
    <nav class="site-nav" aria-label="Primary">
      <ul class="nav-list">
        <li><a href="{{ '/'            | relative_url }}">Home</a></li>
        <li><a href="{{ '/about/'      | relative_url }}">About</a></li>
        <li><a href="{{ '/projects/'   | relative_url }}">Projects</a></li>
        <li><a href="{{ '/resume/'     | relative_url }}">Resume</a></li>
        <li><a href="{{ '/contact/'    | relative_url }}">Contact</a></li>
      </ul>
    </nav>

    <!-- Burger button (only shows on phones via CSS) -->
    <button class="nav-toggle" aria-controls="mobile-menu" aria-expanded="false" aria-label="Open menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
  </div>

  <!-- Dim background overlay (phones only) -->
  <div class="mobile-overlay"></div>

  <!-- Mobile menu panel (phones only) -->
  <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile">
    <ul>
      <li><a href="{{ '/'            | relative_url }}">Home</a></li>
      <li><a href="{{ '/about/'      | relative_url }}">About</a></li>
      <li><a href="{{ '/projects/'   | relative_url }}">Projects</a></li>
      <li><a href="{{ '/resume/'     | relative_url }}">Resume</a></li>
      <li><a href="{{ '/contact/'    | relative_url }}">Contact</a></li>
    </ul>
  </nav>
</header>
